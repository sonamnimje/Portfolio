<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Kawaii Chibi Avatar</title>
<style>
  :root{
    --line:#1a1a1a;
    --paper:#ffffff;
    --border:#d8d8d8;
  }
  html,body{
    height:100%;
    margin:0;
    display:flex;
    align-items:center;
    justify-content:center;
    background:#f2f2f2;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  }
  .stage{
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:18px;
  }
  .avatar-wrap{
    width:220px;
    height:220px;
    cursor:pointer;
  }
  svg{
    width:100%;
    height:100%;
    overflow:visible;
  }
  .badge-fill{ fill:var(--paper); }
  .badge-border{ fill:none; stroke:var(--border); stroke-width:2; }

  /* everything that makes up the character bounces/tilts together */
  .character{
    transform-origin:100px 112px;
    transition:transform 420ms cubic-bezier(.34,1.56,.64,1);
  }
  .avatar-wrap:hover .character{
    animation:bounceTilt 480ms cubic-bezier(.34,1.56,.64,1) forwards;
  }

  @keyframes bounceTilt{
    0%   { transform: scale(1) rotate(0deg); }
    45%  { transform: scale(1.06) rotate(-4deg); }
    70%  { transform: scale(0.99) rotate(-3deg); }
    100% { transform: scale(1.03) rotate(-3deg); }
  }

  /* hair drawn twice: rest + bounced, cross-faded */
  .hair-rest, .hair-bounce{
    transition:opacity 350ms ease-in-out;
  }
  .hair-bounce{ opacity:0; }
  .avatar-wrap:hover .hair-rest{ opacity:0; }
  .avatar-wrap:hover .hair-bounce{ opacity:1; }

  /* glasses shift a touch with the head - handled by parent transform already,
     small extra nudge for a floaty feel */
  .glasses{
    transition:transform 380ms ease-in-out;
    transform-origin:100px 108px;
  }
  .avatar-wrap:hover .glasses{
    transform:translateY(-1.5px);
  }

  /* face states cross-fade */
  .face-default, .face-hover{
    transition:opacity 300ms ease-in-out;
  }
  .face-hover{ opacity:0; }
  .avatar-wrap:hover .face-default{ opacity:0; }
  .avatar-wrap:hover .face-hover{ opacity:1; }

  /* blush fades in with the laugh */
  .blush{
    opacity:0;
    transition:opacity 380ms ease-in-out 60ms;
  }
  .avatar-wrap:hover .blush{ opacity:1; }

  /* motion lines: fade in then gently pulse while hovered */
  .motion-lines{
    opacity:0;
    transition:opacity 250ms ease-in-out;
  }
  .avatar-wrap:hover .motion-lines{
    opacity:1;
    animation:pulseLines 900ms ease-in-out 380ms infinite;
  }
  @keyframes pulseLines{
    0%,100%{ opacity:0.55; }
    50%{ opacity:1; }
  }

  /* subtle continuous laugh loop: tiny head wobble while held */
  .avatar-wrap:hover .character{
    animation:bounceTilt 480ms cubic-bezier(.34,1.56,.64,1) forwards,
              laughLoop 1400ms ease-in-out 480ms infinite;
  }
  @keyframes laughLoop{
    0%,100%{ transform: scale(1.03) rotate(-3deg) translateY(0); }
    50%{ transform: scale(1.045) rotate(-4deg) translateY(-2px); }
  }

  .label{
    font-size:13px;
    color:#888;
    letter-spacing:.02em;
  }
</style>
</head>
<body>
<div class="stage">
  <div class="avatar-wrap">
    <svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">

      <!-- badge -->
      <circle class="badge-fill" cx="100" cy="100" r="96"/>
      <circle class="badge-border" cx="100" cy="100" r="96"/>

      <g class="character">

        <!-- motion lines (laugh only) -->
        <g class="motion-lines" stroke="var(--line)" stroke-width="2.2" stroke-linecap="round" fill="none">
          <path d="M40 70 L28 62"/>
          <path d="M36 90 L22 88"/>
          <path d="M40 112 L27 118"/>
          <path d="M160 70 L172 62"/>
          <path d="M164 90 L178 88"/>
          <path d="M160 112 L173 118"/>
        </g>

        <!-- HAIR : rest state -->
        <g class="hair-rest" fill="var(--line)" stroke="var(--line)" stroke-width="2" stroke-linejoin="round">
          <path d="M100 40
                   C 66 40 52 66 54 96
                   C 55 108 58 118 62 126
                   C 60 108 62 92 68 84
                   C 70 96 70 108 73 118
                   C 72 100 76 88 82 82
                   C 82 96 84 108 88 116
                   C 87 100 90 88 96 84
                   C 97 98 98 108 100 116
                   C 102 108 103 98 104 84
                   C 110 88 113 100 112 116
                   C 116 108 118 96 118 82
                   C 124 88 128 100 127 118
                   C 130 108 132 96 130 84
                   C 136 92 138 108 136 126
                   C 140 118 143 108 144 96
                   C 146 66 134 40 100 40 Z"/>
        </g>

        <!-- HAIR : bounced state (shifted up + slightly wider swing) -->
        <g class="hair-bounce" fill="var(--line)" stroke="var(--line)" stroke-width="2" stroke-linejoin="round">
          <path d="M100 36
                   C 64 36 50 62 52 92
                   C 53 106 57 118 61 128
                   C 58 106 60 88 66 78
                   C 69 92 69 106 72 118
                   C 70 96 75 82 82 76
                   C 82 92 84 106 88 116
                   C 86 96 90 82 96 78
                   C 97 94 98 106 100 116
                   C 102 106 103 94 104 78
                   C 110 82 114 96 112 116
                   C 116 106 118 92 118 76
                   C 125 82 130 96 129 118
                   C 132 106 133 92 131 78
                   C 138 88 141 106 139 128
                   C 143 118 147 106 148 92
                   C 150 62 136 36 100 36 Z"/>
        </g>

        <!-- FACE / HEAD base -->
        <circle cx="100" cy="104" r="52" fill="var(--paper)" stroke="var(--line)" stroke-width="3.5"/>

        <!-- BANGS on top of head, sitting over forehead -->
        <path d="M56 92
                 C 60 70 78 58 100 58
                 C 122 58 140 70 144 92
                 C 136 82 122 76 112 80
                 C 108 74 100 72 96 78
                 C 88 74 80 78 76 84
                 C 68 80 60 84 56 92 Z"
              fill="var(--line)"/>

        <!-- GLASSES -->
        <g class="glasses" stroke="var(--line)" stroke-width="3" fill="none" stroke-linecap="round">
          <circle cx="82" cy="106" r="15"/>
          <circle cx="118" cy="106" r="15"/>
          <path d="M97 104 L103 104"/>
          <path d="M67 102 L58 98"/>
          <path d="M133 102 L142 98"/>
        </g>

        <!-- FACE: DEFAULT (calm smile, eyes open) -->
        <g class="face-default">
          <circle cx="82" cy="106" r="3.4" fill="var(--line)"/>
          <circle cx="118" cy="106" r="3.4" fill="var(--line)"/>
          <path d="M90 124 Q100 132 110 124" stroke="var(--line)" stroke-width="3" fill="none" stroke-linecap="round"/>
        </g>

        <!-- FACE: HOVER (laughing, eyes closed, open smile) -->
        <g class="face-hover">
          <!-- closed happy eyes ^ ^ -->
          <path d="M75 104 Q82 98 89 104" stroke="var(--line)" stroke-width="3" fill="none" stroke-linecap="round"/>
          <path d="M111 104 Q118 98 125 104" stroke="var(--line)" stroke-width="3" fill="none" stroke-linecap="round"/>
          <!-- wide open laughing mouth with teeth -->
          <path d="M86 120 Q100 140 114 120 Q100 128 86 120 Z" fill="var(--line)"/>
          <path d="M91 122 L109 122" stroke="var(--paper)" stroke-width="2"/>
        </g>

        <!-- BLUSH -->
        <g class="blush" fill="var(--line)" opacity="0">
          <ellipse cx="70" cy="118" rx="6" ry="3" opacity="0.55"/>
          <ellipse cx="130" cy="118" rx="6" ry="3" opacity="0.55"/>
        </g>

      </g>
    </svg>
  </div>
  <div class="label">hover the avatar</div>
</div>
</body>
</html>
